# Baseline: single full-precision actor, no switching
experiment_name: baseline_llama2_7b_gsm8k
description: >
  Single-actor baseline on GSM8K with Llama 2 7B BF16.
  Used as the accuracy and latency reference for hybrid pipeline experiments.

benchmark:
  name: gsm8k
  split: test
  max_examples: 200
  seed: 42

actors:
  - actor_id: fp_actor
    model_id: meta-llama/Llama-2-7b-hf
    backend: transformers
    precision: bf16
    quantization: none
    device_map: auto
    generation_params:
      max_new_tokens: 512
      temperature: 0.0
      stop_sequences: ["</s>"]

pipeline:
  - actor_id: fp_actor
    exit_conditions: []   # run until natural stop
    handoff_mode: full_prefill
    role: reasoning

metrics:
  - name: accuracy
  - name: parse_rate
  - name: reasoning_length
  - name: loop_detected
  - name: commit_gap
  - name: total_generation_ms
  - name: segment_timing_ms

output:
  base_dir: results
  save_traces: true
  save_timing: true
  parquet_summary: true
