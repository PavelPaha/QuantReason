experiment_name: final_arc_easy_single_fp16_close_think
description: >
  arc_easy: Qwen3-32B close-think (empty think block) + direct answer prefix.
  No reasoning; assistant continues from "The final answer is: ".

benchmark:
  name: arc_easy
  split: test
  max_examples: null
  seed: 42

staged_execution: true
staged_unload_between_waves: false
staged_batch_size: 100
max_total_tokens: 8192

actors:
  - actor_id: qwen3_32b_fp16
    model_id: Qwen/Qwen3-32B
    backend: vllm
    precision: fp16
    quantization: none
    backend_kwargs:
      cuda_visible_devices: "0"
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.88
      max_model_len: 8192
      enable_prefix_caching: true
      enforce_eager: false
    generation_params:
      max_new_tokens: 256
      temperature: 0.6
      seed: 42
      stop_sequences: ["<|im_end|>", "<|endoftext|>"]

pipeline:
  - actor_id: qwen3_32b_fp16
    role: answer
    handoff_mode: prompt_without_think
    stage_prompt_placement: plan_scaffold
    max_new_tokens: 256
    exclude_stage_prompt_from_trace: true
    stage_system_prompt: |-
      You are a helpful assistant.
    stage_prompt: |-
      End with a single line containing only the letter A, B, C, or D.
    stage_assistant_suffix: "The final answer is: "
    stop_sequences:
      - "<|im_end|>"
      - "<|endoftext|>"
    exit_conditions: []

metrics:
  - name: accuracy
  - name: parse_rate
  - name: exact_match
  - name: reasoning_length
  - name: think_closed
  - name: total_generation_ms
  - name: tokens_per_second

output:
  base_dir: results
  save_traces: true
  save_raw_generations: true
  save_timing: true
  save_errors: true
  parquet_summary: true
  trace_include_llm_prompt: true
