# Llama 2 7B — GPTQ 4-bit quantization via transformers + auto-gptq
actor_id: llama2_7b_gptq4bit
model_id: TheBloke/Llama-2-7B-GPTQ
backend: transformers
precision: fp16
quantization: gptq
quantization_config:
  bits: 4
  disable_exllama: false
device_map: auto
generation_params:
  max_new_tokens: 2048
  temperature: 0.0
  repetition_penalty: 1.0
  stop_sequences: ["</s>"]
